<div class="accounts-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title class="page-title">
        <mat-icon>settings</mat-icon>
        <span>Account Maintenance</span>
      </mat-card-title>
      <div class="header-actions">
        <button mat-flat-button color="primary" (click)='addAccount()'>
          <mat-icon>add</mat-icon>
          <span>Add Account</span>
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      @if (hasAccounts()) {
        <table mat-table [dataSource]="accounts()" class="accounts-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let account">{{ account.name }}</td>
          </ng-container>

          <ng-container matColumnDef="platform">
            <th mat-header-cell *matHeaderCellDef>Platform</th>
            <td mat-cell *matCellDef="let account">{{ account.platform || '-' }}</td>
          </ng-container>

          <ng-container matColumnDef="accountNumber">
            <th mat-header-cell *matHeaderCellDef>Account #</th>
            <td mat-cell *matCellDef="let account">{{ account.accountNumber || '-' }}</td>
          </ng-container>

          <ng-container matColumnDef="currency">
            <th mat-header-cell *matHeaderCellDef>Currency</th>
            <td mat-cell *matCellDef="let account">{{ account.currency }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let account" class="actions-cell">
              <button mat-icon-button (click)="editAccount(account)" matTooltip="Edit account">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteAccount(account)" matTooltip="Delete account">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      } @else {
        <div class="no-accounts">
          <p>No accounts found. Click "Add Account" to get started.</p>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
